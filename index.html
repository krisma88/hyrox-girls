    var rows = S.data.results.filter(function (r) { return S.filter === "all" || r.athlete_id === S.filter; });
    h += '<section class="card"><div class="list">' + (rows.slice(0, S.showN).map(function (r) { return resultRow(r, true); }).join("") || '<div class="muted">Nessun risultato.</div>') + "</div></section>";
    if (rows.length > S.showN) h += '<button class="btn" data-act="more">Mostra altri (' + (rows.length - S.showN) + ")</button>";
    return h;
  }
  function dataAthletes() {
    var h = '<div class="small muted">Il nome breve è quello che si scrive nel bot (es. "Ale wall ball 4:35"). Un\'atleta disattivata resta nello storico ma esce da squadra e staffetta.</div>';
    S.data.athletes.forEach(function (a) {
      h += '<form class="card" data-form="athlete" data-id="' + a.id + '"><div class="row">' + avatar(a, 56) + '<label class="btn" style="display:inline-flex;align-items:center">Cambia foto<input type="file" accept="image/*" data-photo="' + a.id + '" hidden></label></div><div class="grid2"><label class="f">Nome breve<input class="i" id="an-' + a.id + '" value="' + esc(a.display_name) + '"></label><label class="f">Nome completo<input class="i" id="af-' + a.id + '" value="' + esc(a.full_name) + '"></label></div><div class="row between"><span class="row" style="gap:8px"><input type="checkbox" id="aa-' + a.id + '" style="width:22px;height:22px"' + (a.active ? " checked" : "") + '><label for="aa-' + a.id + '">Attiva</label></span><button class="btn primary" type="submit">Salva</button></div></form>';
    });
    return h + '<form class="card" data-form="athlete-new"><div class="grid2"><label class="f">Nome breve<input class="i" id="new-ath"></label><button class="btn dashed" type="submit" style="align-self:flex-end">+ Aggiungi atleta</button></div></form>';
  }
  function dataPesi() {
    var h = '<div class="small muted">Valori ufficiali della gara donne relay. Se il regolamento cambia si aggiornano qui e previsioni e stime si ricalcolano.</div>';
    ORDER.forEach(function (c) { var e = exInfo(c); h += '<form class="card" data-form="ex" data-id="' + c + '"><div style="font-weight:700">' + esc(e.name) + '</div><div class="grid2"><label class="f">Quantità (' + e.unit + ')<input class="i" id="ea-' + c + '" inputmode="decimal" value="' + (e.amount == null ? "" : e.amount) + '"></label><label class="f">Peso gara kg<input class="i" id="el-' + c + '" inputmode="decimal" value="' + (e.load == null ? "" : e.load) + '"></label></div><div class="row between"><span class="small muted">' + esc(e.spec) + '</span><button class="btn primary" type="submit">Salva</button></div></form>'; });
    return h;
  }
  function dataImport() {
    var h = '<section class="card"><div class="eyebrow">Carica il Registro Excel</div><div class="small soft">Si leggono i fogli Cristina, Alessandra, Daniela e Arianna. Righe nuove aggiunte, modificate aggiornate, invariate ignorate. Tipo strumento ALTERNATIVO: salvate ma escluse dalle previsioni. I dati di Telegram non vengono toccati.</div><label class="btn primary" style="display:inline-flex;align-items:center;justify-content:center">' + (S.busy ? "Caricamento…" : "Scegli il file .xlsx") + '<input type="file" accept=".xlsx" id="xlsx" hidden></label>';
    if (S.importRes) { var r = S.importRes; h += '<div class="grid3"><div class="tile"><span class="eyebrow">Aggiunte</span><span class="num" style="font-size:22px">' + r.aggiunte + '</span></div><div class="tile"><span class="eyebrow">Rimosse</span><span class="num" style="font-size:22px">' + r.rimosse + '</span></div><div class="tile"><span class="eyebrow">Invariate</span><span class="num" style="font-size:22px">' + r.invariate + "</span></div></div>" + (r.scartate && r.scartate.length ? '<div class="small err">Righe scartate: ' + r.scartate.map(function (s) { return esc(s.riga || ""); }).join(", ") + "</div>" : ""); }
    h += "</section>";
    if (S.runs) h += '<h2>Ultimi caricamenti</h2><section class="card"><div class="list">' + S.runs.map(function (r) { return '<div><div style="font-weight:700" class="small">' + esc(new Date(r.created_at).toLocaleString("it-IT")) + " · " + esc(r.file_name || "") + '</div><div class="small muted">+' + r.inserted + " aggiunte · −" + r.deleted + " rimosse · " + r.unchanged + " invariate</div></div>"; }).join("") + "</div></section>";
    return h;
  }

  function viewBot() {
    var names = S.data.athletes.filter(function (a) { return a.active; }).map(function (a) { return a.display_name; });
    return '<div class="soft">I tempi si possono inserire dal gruppo Telegram: scrivendo libero, anche più righe insieme, oppure con /registra e i pulsanti.</div><section class="card" style="gap:8px"><div class="eyebrow">Esempi</div><div class="small muted">Messaggi di prova per mostrare come si scrive: i tempi e i nomi qui sotto sono inventati, non sono risultati veri.</div>' +
      '<div class="bubble me">Ale wall ball 4:35\nDany burpee 40m 2:10\nCri sled push 2:12 90kg</div><div class="bubble bot">Ale · Wall Balls 4:35 · −8s rispetto all\'ultima\nDany · Burpee 40 m 2:10 · stima su 80 m\nCri · Sled Push 2:12 · 90 kg</div>' +
      '<div class="bubble me">/registra</div><div class="bubble bot">Per chi?  ' + esc(names.join(" · ")) + '\n→ Prova completa o parziale\n→ Esercizio → Quantità → Carico → Tempo</div>' +
      '<div class="bubble me">/tempi Ari</div><div class="bubble bot">Ari · ultimi tempi e record per ogni esercizio</div></section>' +
      '<section class="card"><div class="eyebrow">Comandi</div><div class="list small"><div><b>/entra CODICE NOME</b> · solo la prima volta, per entrare nel team (es. /entra codice Ari)</div><div><b>/registra</b> · inserimento guidato con i pulsanti</div><div><b>/tempi nome</b> · ultimi tempi e record</div><div><b>/annulla</b> · toglie il tuo ultimo inserimento</div><div><b>/aiuto</b> · tutti i comandi</div></div><div class="small muted">Si possono scrivere più righe in un messaggio, con kg (80kg), metri o ripetizioni (500m, 50rep) e tempi come 4:35, 3 min, 275s.</div></section>' +
      '<section class="card"><div class="eyebrow">File Excel settimanale</div><div class="small soft">Si carica da Dati → Importa, con la password della squadra.</div></section>';
  }

  /* ---------- render ---------- */
  function render() {
    document.getElementById("subtitle").textContent = TITLES[S.tab];
    document.getElementById("tabs").innerHTML = TABS.map(function (t) { return '<a href="#' + t[0] + '" class="' + (S.tab === t[0] ? "on" : "") + '"' + (S.tab === t[0] ? ' aria-current="page"' : "") + ">" + t[1] + "</a>"; }).join("");
    var v = document.getElementById("view");
    if (S.loadErr) { v.innerHTML = '<section class="card"><div class="err">Non riesco a leggere i dati (' + esc(S.loadErr) + ').</div><button class="btn primary" data-act="reload">Riprova</button></section>'; return; }
    if (!S.data) return;
    var fn = { squadra: viewSquadra, atleta: viewAtleta, staffetta: viewStaffetta, dati: viewDati, bot: viewBot }[S.tab];
    v.innerHTML = fn();
  }
  function fromHash() { var h = (location.hash || "").replace("#", ""); S.tab = TABS.some(function (t) { return t[0] === h; }) ? h : "squadra"; S.msg = ""; S.err = ""; if (S.tab === "dati" && S.dataTab === "importa") loadRuns(); render(); window.scrollTo(0, 0); }
  window.addEventListener("hashchange", fromHash);

  function guard(p) {
    S.busy = true; S.err = ""; render();
    return p.then(function (x) { S.busy = false; return x; }, function (e) { S.busy = false; if (e.pw) { store("hg_pw", null); S.err = "Password errata, riprova."; } else S.err = e.message || "Operazione non riuscita."; render(); throw e; });
  }
  function refresh(msg) { return load().then(function () { S.msg = msg || ""; render(); }); }
  function loadRuns() { rpc("hg_import_runs").then(function (r) { S.runs = r; render(); }, function () {}); }
  function syncForm() {
    var g = function (id) { var el = document.getElementById(id); return el ? el.value : ""; };
    if (!S.form) return;
    S.form.athlete_id = g("f-ath") || S.form.athlete_id; S.form.performed_on = g("f-date"); S.form.time = g("f-time");
    S.form.reps = g("f-reps"); S.form.resistance = g("f-res"); S.form.speed_kmh = g("f-spd"); S.form.note = g("f-note");
    var off = document.getElementById("f-off"); if (off) S.form.official_equipment = off.checked;
  }
  function num(id) { var v = (document.getElementById(id).value || "").trim().replace(",", "."); return v === "" ? null : Number(v); }

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-act]"); if (!t) return;
    var act = t.getAttribute("data-act"), id = t.getAttribute("data-id");
    if (act === "reload") { refresh(); return; }
    if (act === "open-ath") { S.ath = id; return; }
    if (act === "ath") { S.ath = id; render(); return; }
    if (act === "ex") { S.ex = id; render(); return; }
    if (act === "cell") { S.cell = S.cell === id ? null : id; render(); return; }
    if (act === "dtab") { S.dataTab = id; S.msg = ""; S.err = ""; if (id === "importa") loadRuns(); render(); return; }
    if (act === "filter") { S.filter = id; S.showN = 15; render(); return; }
    if (act === "more") { S.showN += 15; render(); return; }
    if (act === "new") { var off = exInfo("row"); S.form = { id: null, athlete_id: S.data.athletes[0] && S.data.athletes[0].id, exercise_code: "row", performed_on: iso(new Date()), time: "", amount: off.amount == null ? "" : off.amount, load_kg: "", reps: "", resistance: "", speed_kmh: "", note: "", official_equipment: true }; render(); return; }
    if (act === "edit") { var r = S.data.results.filter(function (x) { return x.id === id; })[0]; S.form = { id: r.id, athlete_id: r.athlete_id, exercise_code: r.exercise_code, performed_on: r.performed_on, time: fmtP(r.seconds), amount: r.amount == null ? "" : Number(r.amount), load_kg: r.load_kg == null ? "" : Number(r.load_kg), reps: r.reps == null ? "" : Number(r.reps), resistance: r.resistance == null ? "" : Number(r.resistance), speed_kmh: r.speed_kmh == null ? "" : Number(r.speed_kmh), note: r.note || "", official_equipment: r.official_equipment !== false }; S.confirmDel = null; render(); window.scrollTo(0, 0); return; }
    if (act === "form-close") { S.form = null; render(); return; }
    if (act === "del") { S.confirmDel = id; render(); return; }
    if (act === "del-no") { S.confirmDel = null; render(); return; }
    if (act === "del-yes") { guard(rpc("hg_result_delete", { p_pw: store("hg_pw"), p_id: id })).then(function () { S.confirmDel = null; return refresh("Risultato eliminato."); }).catch(function () {}); return; }
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.id === "f-ex" && S.form) { syncForm(); S.form.exercise_code = t.value; var off = exInfo(t.value); S.form.amount = off.amount == null ? "" : off.amount; S.form.load_kg = off.load == null ? "" : off.load; render(); return; }
    if (t.hasAttribute && t.hasAttribute("data-photo") && t.files[0]) { photo(t.getAttribute("data-photo"), t.files[0]); return; }
    if (t.id === "xlsx" && t.files[0]) { importFile(t.files[0]); }
  });
  document.addEventListener("submit", function (ev) {
    var f = ev.target, k = f.getAttribute("data-form"); if (!k) return; ev.preventDefault();
    if (k === "pw") {
      var pw = document.getElementById("pw-in").value;
      rpc("hg_check", { p_pw: pw }).then(function (ok) { if (ok) { store("hg_pw", pw); S.err = ""; if (S.dataTab === "importa") loadRuns(); } else S.err = "Password errata, riprova."; render(); }, function (e) { S.err = e.message; render(); });
      return;
    }
    if (k === "result") {
      var secs = parseTime(document.getElementById("f-time").value);
      if (!secs) { S.err = "Tempo non valido: scrivilo come 4:35, 4:35,20 o 1:02:30."; render(); return; }
      var date = document.getElementById("f-date").value; if (!date) { S.err = "Manca la data."; render(); return; }
      var ex = document.getElementById("f-ex").value, amt = num("f-amount");
      var p = { id: S.form.id, athlete_id: document.getElementById("f-ath").value, exercise_code: ex, performed_on: date, seconds: Math.round(secs * 100) / 100, amount: amt, distance_m: exInfo(ex).unit === "m" ? amt : null, load_kg: num("f-kg"), reps: exInfo(ex).unit === "rip." ? amt : num("f-reps"), resistance: num("f-res"), speed_kmh: num("f-spd"), note: document.getElementById("f-note").value.trim(), official_equipment: document.getElementById("f-off").checked };
      guard(rpc("hg_result_save", { p_pw: store("hg_pw"), p: p })).then(function () { S.form = null; return refresh("Risultato salvato."); }).catch(function () {});
      return;
    }
    if (k === "athlete") { var aid = f.getAttribute("data-id"); guard(rpc("hg_athlete_save", { p_pw: store("hg_pw"), p: { id: aid, display_name: document.getElementById("an-" + aid).value, full_name: document.getElementById("af-" + aid).value, active: document.getElementById("aa-" + aid).checked } })).then(function () { return refresh("Atleta salvata."); }).catch(function () {}); return; }
    if (k === "athlete-new") { var nm = document.getElementById("new-ath").value.trim(); if (!nm) return; guard(rpc("hg_athlete_save", { p_pw: store("hg_pw"), p: { display_name: nm, active: true } })).then(function () { return refresh("Atleta aggiunta."); }).catch(function () {}); return; }
    if (k === "ex") { var c = f.getAttribute("data-id"); guard(rpc("hg_exercise_save", { p_pw: store("hg_pw"), p_code: c, p_amount: num("ea-" + c), p_load: num("el-" + c) })).then(function () { return refresh("Valori di gara salvati."); }).catch(function () {}); }
  });

  function photo(aid, file) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(img.width, img.height), cv = document.createElement("canvas"); cv.width = cv.height = 220;
        cv.getContext("2d").drawImage(img, (img.width - s) / 2, Math.max(0, (img.height - s) / 2 - s * 0.08), s, s, 0, 0, 220, 220);
        var url = cv.toDataURL("image/jpeg", 0.82);
        guard(rpc("hg_athlete_save", { p_pw: store("hg_pw"), p: { id: aid, photo_url: url } })).then(function () { return refresh("Foto aggiornata."); }).catch(function () {});
      };
      img.onerror = function () { S.err = "Non riesco a leggere questa immagine."; render(); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  /* lettura Excel: stesse regole dell'import del database */
  var COLS = [["data","date"],["stazione","station"],["distanza","distance_m"],["chili","load_kg"],["ripetizioni","reps"],["pendenza","incline_pct"],["resistenza","resistance"],["velocit","speed_kmh"],["tempo","seconds"],["rpe","rpe"],["note","note"],["tipo strumento","tool_type"]];
  function xSecs(v) { if (v == null || v === "") return null; if (typeof v === "number") return v < 1 ? Math.round(v * 86400 * 100) / 100 : Math.round(v * 100) / 100; var p = parseTime(v); return p == null ? null : Math.round(p * 100) / 100; }
  function xNum(v) { if (v == null || v === "") return null; var n = typeof v === "number" ? v : Number(String(v).trim().replace(",", ".")); return isFinite(n) ? n : null; }
  function xStr(v) { if (v == null) return null; var s = String(v).trim(); return s || null; }
  function importFile(file) {
    if (typeof XLSX === "undefined") { S.err = "La libreria per leggere l'Excel non si è caricata: ricarica la pagina."; render(); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var rows = [];
      try {
        var wb = XLSX.read(new Uint8Array(fr.result), { type: "array", cellDates: false });
        ["Cristina","Alessandra","Daniela","Arianna"].forEach(function (name) {
          var ws = wb.Sheets[name]; if (!ws) return;
          var grid = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true });
          var start = XLSX.utils.decode_range(ws["!ref"] || "A1").s.r, hdr = -1;
          for (var i = 0; i < Math.min(10, grid.length); i++) { var cells = (grid[i] || []).map(function (c) { return String(c == null ? "" : c).trim().toLowerCase(); }); if (cells.indexOf("data") >= 0 && cells.indexOf("stazione") >= 0) { hdr = i; break; } }
          if (hdr < 0) return;
          var head = grid[hdr].map(function (c) { return String(c == null ? "" : c).trim().toLowerCase(); }), idx = {};
          COLS.forEach(function (c) { var j = head.findIndex(function (x) { return x.indexOf(c[0]) === 0; }); if (j >= 0) idx[c[1]] = j; });
          var g = function (row, k) { return idx[k] === undefined ? null : row[idx[k]]; };
          for (var r = hdr + 1; r < grid.length; r++) {
            var row = grid[r] || [], dv = g(row, "date"), st = xStr(g(row, "station"));
            if (typeof dv !== "number" || !st) continue;
            var d = XLSX.SSF.parse_date_code(dv); if (!d || !d.y) continue;
            rows.push({ sheet_row: name + "!" + (start + r + 1), athlete: name, date: d.y + "-" + pad2(d.m) + "-" + pad2(d.d), station: st, seconds: xSecs(g(row, "seconds")), distance_m: xNum(g(row, "distance_m")), load_kg: xNum(g(row, "load_kg")), reps: xNum(g(row, "reps")), incline_pct: xNum(g(row, "incline_pct")), resistance: xNum(g(row, "resistance")), speed_kmh: xNum(g(row, "speed_kmh")), rpe: xNum(g(row, "rpe")), note: xStr(g(row, "note")), tool_type: xStr(g(row, "tool_type")) });
          }
        });
      } catch (e) { S.err = "Il file non sembra un Excel valido."; render(); return; }
      if (!rows.length) { S.err = "Nessuna riga valida trovata nei fogli delle atlete."; render(); return; }
      guard(rpc("hg_import", { p_pw: store("hg_pw"), p_rows: rows, p_file: file.name })).then(function (res) { S.importRes = res; loadRuns(); return refresh("File caricato."); }).catch(function () {});
    };
    fr.readAsArrayBuffer(file);
  }

  document.getElementById("reload").addEventListener("click", function () { location.replace(location.pathname + "?v=" + Date.now() + location.hash); });
  S.tab = "squadra"; fromHash();
  load().then(render);
})();
</script>

</body>
</html>
